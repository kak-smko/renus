name: Weekly benchmarks

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-benchmarks
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install benchmark dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run benchmarks
        run: python benchmarks/compare.py --duration 60 --concurrency 64 --output benchmarks/RESULTS.md

      - name: Commit updated results
        run: |
          git add benchmarks/RESULTS.md
          if git diff --cached --quiet -- benchmarks/RESULTS.md; then
            echo "Benchmark results are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update weekly benchmark results"
          git push
