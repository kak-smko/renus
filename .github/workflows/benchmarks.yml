name: Weekly benchmarks

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-benchmarks
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install benchmark dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run benchmarks
        run: python benchmarks/compare.py --duration 60 --concurrency 64

      - name: Publish results in README
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          results = Path("benchmarks/RESULTS.md").read_text(encoding="utf-8").strip()
          content = readme.read_text(encoding="utf-8")
          start_marker = "<!-- benchmark-results:start -->"
          end_marker = "<!-- benchmark-results:end -->"
          start = content.index(start_marker) + len(start_marker)
          end = content.index(end_marker, start)
          content = content[:start] + "\n\n" + results + "\n\n" + content[end:]
          readme.write_text(content, encoding="utf-8")
          PY

      - name: Commit updated results
        run: |
          if git diff --quiet -- README.md; then
            echo "Benchmark results are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update weekly benchmark results"
          git push
